[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fdpi"
version = "1.0.0"
description = "FDπ: policy-feature Fréchet distance for evaluating driving world models"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["fdpi*", "navsim*"]
namespaces = true

[tool.setuptools.package-data]
fdpi = ["configs/*.yaml", "configs/agents/*.yaml"]
